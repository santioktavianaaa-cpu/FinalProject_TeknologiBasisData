<head>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>📈 Tren Penjualan Bulanan</h1>
            <p>Analisis penjualan berdasarkan dimensi waktu (Time Series)</p>
            <span class="subtitle">FactPenjualan JOIN DimTanggal</span>
        </div>

        <!-- MENU NAVIGASI -->
        <div class="nav-menu">
            <a href="index.html" class="nav-item">🏠 Dashboard</a>
            <a href="sales_trend.html" class="nav-item active">📈 Tren Penjualan</a>
            <a href="products.html" class="nav-item">📦 Produk</a>
            <a href="location.html" class="nav-item">📍 Lokasi</a>
            <a href="employee.html" class="nav-item">👥 Pegawai</a>
            <a href="category.html" class="nav-item">🏷️ Kategori</a>
        </div>

    <!-- Tambah sebelum chart-section -->
    <div class="filter-section" style="text-align: center; margin-bottom: 20px;">
        <label style="color: #ad1457; font-weight: 600;">Filter Tahun:</label>
        <select id="yearFilter" style="padding: 8px; border-radius: 6px; border: 2px solid #e91e63;">
            <option value="all">Semua</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
        </select>
        <button onclick="applyFilter()" class="nav-button" style="padding: 8px 20px; margin-left: 10px;">
            Terapkan Filter
        </button>
    </div>


        <!-- CHART SECTION -->
        <div class="chart-section">
            <h2>Grafik Penjualan per Bulan</h2>
            <div class="chart-container">
                <canvas id="salesChart"></canvas>
            </div>
        </div>
    </div>

    <script src="js/trend.js"></script>
